name: CPU artifact checks
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[analysis]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_paper_experiments.py --condition all --plan-output outputs/dry_run.json > /dev/null
      - run: python scripts/check_synthetic_report.py --output-dir outputs/synthetic_report
      - run: python scripts/make_release.py --check
