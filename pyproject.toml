[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soict-child-subtree-retrieval"
version = "0.5.1"
description = "Task-aligned SFT for hierarchical scientific literature retrieval (SoICT artifact)"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
eval = ["openai>=1.0,<2", "httpx>=0.27,<1"]
analysis = ["numpy>=1.26,<3"]
tree = ["numpy>=1.26,<3", "torch>=2.4", "transformers==4.52.4", "scikit-learn>=1.7,<2", "tqdm>=4.67", "flash-kmeans"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soict_ir = ["prompts.json"]
